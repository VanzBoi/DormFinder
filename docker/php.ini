; Production settings for the DormFinder container.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
expose_php=Off
memory_limit=256M
post_max_size=48M
upload_max_filesize=6M
max_file_uploads=8
session.cookie_httponly=1
session.use_only_cookies=1
opcache.enable=1
opcache.validate_timestamps=0
